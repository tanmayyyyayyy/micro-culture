<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mc-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc-emblem-gradient" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="mc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient cosmic backlight -->
  <circle cx="50" cy="50" r="46" fill="url(#mc-ambient-glow)" />

  <!-- Orbital arc (clockwise curve around emblem) -->
  <path
    d="M 78 24 A 41 41 0 1 0 45 91"
    stroke="url(#mc-emblem-gradient)"
    stroke-width="4.2"
    stroke-linecap="round"
  />

  <!-- Terminal node on orbital arc -->
  <circle cx="45" cy="91" r="2.8" fill="url(#mc-emblem-gradient)" />

  <!-- Satellite / Cultural Memory node -->
  <circle cx="73" cy="74" r="3.4" fill="url(#mc-emblem-gradient)" filter="url(#mc-glow)" />

  <!-- Central Architectural Monogram "M" -->
  <path
    d="M 36 68 V 32 L 50 62 L 64 32 V 68"
    stroke="url(#mc-emblem-gradient)"
    stroke-width="4.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
